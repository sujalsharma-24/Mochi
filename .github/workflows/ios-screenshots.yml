name: iOS Screenshots

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-screenshots.yml"
  workflow_dispatch: {}

jobs:
  screenshots:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Prepare screenshot output dir
        working-directory: ios
        run: mkdir -p screenshots

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          # Matching by name alone (the previous approach) breaks once a runner image ships more
          # than one iOS runtime — two simulators can share the exact same device name (e.g. an
          # "iPhone 16 Pro" under two different iOS versions), which makes xcodebuild's
          # name-only `-destination` matching ambiguous and fails immediately, before any real
          # build/test work happens. Matching by UDID is unambiguous regardless of how many
          # runtimes are installed. Picks the iPhone with the highest available iOS runtime.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d.get("name", "").startswith("iPhone"):
                      candidates.append((runtime, d["name"], d["udid"]))
          candidates.sort(key=lambda c: c[0])
          if not candidates:
              sys.exit(1)
          runtime, name, udid = candidates[-1]
          print(f"Using simulator: {name} ({runtime}) udid={udid}", file=sys.stderr)
          print(udid)
          ' 2>/tmp/sim_log.txt)
          cat /tmp/sim_log.txt
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run screenshot UI test
        working-directory: ios
        run: |
          # Raw logs and artifact zips can't be downloaded without repo-admin auth (see
          # docs/IOS_FUNCTIONAL_STATUS.md), so on failure we can't just look at the log later —
          # we have to surface the actual error text as GitHub Check annotations instead, since
          # those ARE readable anonymously via the REST API. `set +e` here so a non-zero
          # xcodebuild exit doesn't kill the script before we get a chance to do that; pipefail
          # (on by default for GitHub Actions' bash steps) still lets $? reflect xcodebuild's
          # real exit code through the `tee` pipe.
          set +e
          xcodebuild test \
            -project Mochi.xcodeproj \
            -scheme MochiApp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResult.xcresult \
            TEST_RUNNER_SCREENSHOT_DIR="$(pwd)/screenshots" \
            2>&1 | tee build.log
          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "xcodebuild exited with $STATUS — extracting failure detail as annotations"
            PATTERN='error:|BUILD FAILED|TEST FAILED|Fatal error|fatalError|EXC_BAD_ACCESS|Thread [0-9]+: |Assertion failed|Testing failed:'
            if grep -qE "$PATTERN" build.log; then
              grep -nE "$PATTERN" build.log | head -n 30 | while IFS= read -r line; do
                # ::error:: annotations are single-line; strip embedded newlines/CRs defensively.
                clean=$(printf '%s' "$line" | tr -d '\r' | tr '\n' ' ')
                echo "::error::${clean}"
              done
            else
              echo "::error::xcodebuild failed with exit $STATUS but no recognizable error pattern was found — see the last lines of the log below"
              tail -n 60 build.log
            fi
          fi

          exit $STATUS

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochi-ios-build-log
          path: ios/build.log
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochi-ios-screenshots
          path: ios/screenshots
          if-no-files-found: warn

      - name: Upload full test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochi-ios-test-result
          path: ios/TestResult.xcresult
          if-no-files-found: ignore
