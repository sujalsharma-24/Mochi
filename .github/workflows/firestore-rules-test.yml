name: Firestore Rules Tests

on:
  push:
    paths:
      - "firestore/**"
      - ".github/workflows/firestore-rules-test.yml"
  pull_request:
    paths:
      - "firestore/**"
  workflow_dispatch: {}

jobs:
  rules-test:
    runs-on: ubuntu-latest # Linux runner deliberately — see docs/TRD.md ADR-013 on macOS runner cost

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install test dependencies
        working-directory: firestore/tests
        run: npm install

      - name: Run Firestore Security Rules tests against the emulator
        working-directory: firestore/tests
        run: |
          PATH="$PWD/node_modules/.bin:$PATH" firebase emulators:exec --only firestore --project mochi-rules-test "npm test"
