name: Mochi
options:
  bundleIdPrefix: com.mochi.app
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

# Firebase/Google/RevenueCat all ship as Swift Package Manager products — no CocoaPods needed, which
# matters here since this repo has no Mac to run `pod install` from (see README's XcodeGen note).
packages:
  # Version floors checked against each package's real GitHub Releases (not raw git tags — that
  # endpoint returned old/prerelease-branch tags sorted in a misleading order and sent one earlier
  # pass here to the wrong major entirely). Latest as of 2026-08-24: firebase-ios-sdk 12.18.0
  # (2026-08-19), GoogleSignIn-iOS 9.2.0 (2026-06-15).
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0

targets:
  MochiApp:
    type: application
    platform: iOS
    sources:
      - path: MochiApp
      # Compiled into both targets rather than linked as a framework — see MochiShared/README.md.
      # A dynamic framework would cost a dyld load on every single keyboard activation.
      - path: MochiShared
      - path: SharedAssets
    info:
      path: MochiApp/App/Info.plist
      properties:
        UILaunchScreen: {}
        UIAppFonts:
          - Fredoka.ttf
          - Baloo2.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          # The face the Fonts page's letter grid previews (Figma: Kaushan Script Regular 22).
          # OFL, like the other three — see ios/licenses/KaushanScript-OFL.txt.
          - KaushanScript-Regular.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Google Sign-In's redirect back into the app. REPLACE_WITH_IOS_REVERSED_CLIENT_ID once
        # GoogleService-Info.plist exists — it's that file's REVERSED_CLIENT_ID value verbatim (a
        # com.googleusercontent.apps.<id> string). Harmless as a placeholder: an unmatched URL
        # scheme just means the OAuth redirect dead-ends in Safari, nothing crashes.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - REPLACE_WITH_IOS_REVERSED_CLIENT_ID
        # FirebaseMessaging installs UIApplicationDelegate method-swizzling hooks automatically at
        # launch (to catch APNs token registration) - this app has no explicit AppDelegate (pure
        # SwiftUI App lifecycle) and, until GoogleService-Info.plist exists, FirebaseApp.configure()
        # is never called at all (see FirebaseEnvironment.configureIfPossible). That combination is
        # exactly the scenario Firebase's own docs warn can crash ("The default Firebase app has not
        # been configured") if the swizzled hooks fire regardless. Disabling the proxy is the
        # documented way to avoid it; push notifications' own future slice will need to forward the
        # APNs device token to Messaging.messaging().apnsToken manually instead of relying on this.
        FirebaseAppDelegateProxyEnabled: false
    # Sign-in-with-Apple entitlement deliberately NOT wired in yet (MochiApp.entitlements exists on
    # disk, unused) — with DEVELOPMENT_TEAM blank, Xcode's capability provisioning for this
    # entitlement needs a real Apple Developer Team even to build for the Simulator, which this CI
    # runner doesn't have. Re-add the `entitlements:` block once Sujal's Apple Developer Program
    # enrollment exists (see docs/IOS_FUNCTIONAL_STATUS.md's blockers table) — the Swift-side
    # Sign in with Apple code (AppleSignInCoordinator) doesn't need this to compile, only to
    # actually authenticate on a real device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mochi.app
        TARGETED_DEVICE_FAMILY: "1,2"
        # No AppIcon.appiconset exists yet (client hasn't delivered a square app icon asset,
        # only docs/figma/mochi_wordmark_reference.png which is a wordmark, not an icon) — turn
        # off the requirement rather than fabricate a placeholder icon. Set this back to "AppIcon"
        # once a real appiconset is added to Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    dependencies:
      - target: MochiKeyboard
        embed: true
      - package: FirebaseSDK
        product: FirebaseAuth
      - package: FirebaseSDK
        product: FirebaseFirestore
      - package: FirebaseSDK
        product: FirebaseFunctions
      - package: FirebaseSDK
        product: FirebaseStorage
      - package: FirebaseSDK
        product: FirebaseMessaging
      - package: FirebaseSDK
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift

  MochiKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: MochiKeyboard
      - path: MochiShared
      # Keyboard background art only — deliberately NOT MochiApp/Assets.xcassets, which is 22 MB
      # of screens, avatars and marketing tiles the extension has no use for and cannot afford
      # under a ~30–48 MB dirty-memory ceiling. The extension is a separate bundle and does not
      # inherit the app's catalogue, so any art a theme references has to live here.
      - path: SharedAssets
    info:
      path: MochiKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Mochi Keyboard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            PrimaryLanguage: en-US
            IsASCIICapable: false
            PrefersRightToLeft: false
            # Full Access is deliberately NOT requested.
            #
            # The theme system is architected so it is never needed: the app writes the theme
            # document into the shared App Group container and the extension only reads it, which
            # the default keyboard sandbox permits. Requesting it would show the user a sheet
            # warning that this keyboard may transmit everything they type — the largest drop-off
            # point in keyboard onboarding — and App Review guideline 4.4.1 requires the keyboard
            # to work fully without it regardless.
            #
            # The two things it would buy are key click sounds (`playInputClick`) and haptics.
            # Neither is worth that permission.
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mochi.app.keyboard
        # The extension is iPhone + iPad like its host. A keyboard that refuses to install on iPad
        # is a support ticket, not a scope decision.
        TARGETED_DEVICE_FAMILY: "1,2"
        # No custom fonts are registered here on purpose. The reference theme uses the system face
        # (see BuiltInThemes), and an extension does NOT inherit the app's UIAppFonts — any theme
        # that names a custom family needs that family added to this target's Info.plist and the
        # font file added to this target's resources, or it silently falls back to the system face.
        GENERATE_INFOPLIST_FILE: NO
        # Same reason as the app target: no appiconset exists, and an extension does not need one.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  MochiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MochiUITests
    dependencies:
      - target: MochiApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mochi.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MochiApp

schemes:
  MochiApp:
    build:
      targets:
        MochiApp: all
        MochiUITests: [test]
    test:
      targets:
        - MochiUITests
    run:
      config: Debug
