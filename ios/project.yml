name: Mochi
options:
  bundleIdPrefix: com.mochi.app
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MochiApp:
    type: application
    platform: iOS
    sources:
      - path: MochiApp
    info:
      path: MochiApp/App/Info.plist
      properties:
        UILaunchScreen: {}
        UIAppFonts:
          - Fredoka.ttf
          - Baloo2.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          # The face the Fonts page's letter grid previews (Figma: Kaushan Script Regular 22).
          # OFL, like the other three — see ios/licenses/KaushanScript-OFL.txt.
          - KaushanScript-Regular.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mochi.app
        TARGETED_DEVICE_FAMILY: "1,2"
        # No AppIcon.appiconset exists yet (client hasn't delivered a square app icon asset,
        # only docs/figma/mochi_wordmark_reference.png which is a wordmark, not an icon) — turn
        # off the requirement rather than fabricate a placeholder icon. Set this back to "AppIcon"
        # once a real appiconset is added to Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  MochiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MochiUITests
    dependencies:
      - target: MochiApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mochi.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MochiApp

schemes:
  MochiApp:
    build:
      targets:
        MochiApp: all
        MochiUITests: [test]
    test:
      targets:
        - MochiUITests
    run:
      config: Debug
